{% extends "base.html" %}
{% block title %}创建案件{% endblock %}
{% block content %}
<section class="page-head">
  <h1>创建案件</h1>
</section>
<form class="card form" method="post" action="/cases/new">
  <label>
    案件名称 *
    <input name="title" required maxlength="500" placeholder="例如：咨询服务费纠纷" />
  </label>
  <label>
    案由 / 备注（可选）
    <textarea name="goal_summary" rows="4" maxlength="4000" placeholder="可选：简要说明争议焦点"></textarea>
  </label>
  <div class="actions">
    <button class="btn primary" type="submit">创建并打开工作台</button>
    <a class="btn" href="/cases">取消</a>
  </div>
</form>
{% endblock %}
