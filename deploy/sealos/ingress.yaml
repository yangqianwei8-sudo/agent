apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lawyer-agent-orchestrator
spec:
  rules:
    - host: lawyer.bja.sealos.run
      http:
        paths:
          - path: /webhooks/github
            pathType: Prefix
            backend:
              service:
                name: lawyer-agent-orchestrator
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: lawyer-agent-orchestrator
                port:
                  number: 8000
