apiVersion: apps/v1
kind: Deployment
metadata:
  name: lawyer-agent-orchestrator
  namespace: ns-dqyh88ke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lawyer-agent-orchestrator
  template:
    metadata:
      labels:
        app: lawyer-agent-orchestrator
    spec:
      restartPolicy: Always
      containers:
        - name: app
          image: ghcr.io/yangqianwei8-sudo/agent:latest
          env:
            - name: GIT_SHA
              value: "unknown"
            - name: IMAGE_TAG
              value: "unknown"
          command: ["/app/.venv/bin/uvicorn"]
          args: ["backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: lawyer-agent-secrets
            - configMapRef:
                name: lawyer-agent-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /app/data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: lawyer-agent-autonomous-state
