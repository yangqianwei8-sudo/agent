apiVersion: v1
kind: Secret
metadata:
  name: lawyer-agent-secrets
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: replace-me
  # Option A (DevBox / quick start): fine-grained PAT with repo contents+metadata write
  GITHUB_TOKEN: ghp_replace-me
  # Option B (production): GitHub App installation token (auto-refreshed by worker)
  GITHUB_APP_ID: "123456"
  GITHUB_APP_INSTALLATION_ID: "12345678"
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    replace-me
    -----END RSA PRIVATE KEY-----
  # Option C: SSH deploy key path (mount private key as secret volume)
  GITHUB_SSH_KEY_PATH: /run/secrets/github-deploy-key
  GITHUB_AUTH_MODE: auto
  CURSOR_API_KEY: key_replace-me
  DATABASE_URL: postgresql+psycopg://user:pass@host:5432/db
