apiVersion: v1
kind: ConfigMap
metadata:
  name: lawyer-agent-config
data:
  AUTONOMOUS_DEV_ENABLED: "true"
  AUTONOMOUS_WORKER_MODE: cursor_sdk
  AUTONOMOUS_REPO_ROOT: /app
  AUTONOMOUS_STATE_DB_PATH: /app/data/autonomous_dev.db
  GITHUB_REPO: yangqianwei8-sudo/agent
  CURSOR_MODEL: composer-2
  WATCHDOG_INTERVAL_SECONDS: "3600"
  WORKER_LEASE_TTL_SECONDS: "300"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "30"
  REVIEW_WATCHDOG_STALE_SECONDS: "3600"
