name: Phase 1 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yangqianwei8-sudo/agent
  K8S_NAMESPACE: ns-dqyh88ke
  K8S_DEPLOYMENT: lawyer-agent-orchestrator
  K8S_CONTAINER: app

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check backend autonomous_dev

      - name: Pytest
        run: pytest -q

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        run: echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  deploy-sealos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        env:
          KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG }}
        run: |
          if [ -n "${KUBECONFIG_B64}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rollout Sealos deployment
        if: steps.creds.outputs.present == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          PUBLIC_URL: https://ynboesvphjna.sealosbja.site
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          NS="${K8S_NAMESPACE}"
          DEP="${K8S_DEPLOYMENT}"
          CTR="${K8S_CONTAINER}"
          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          BT="${BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          kubectl get deployment "${DEP}" -n "${NS}"
          kubectl patch deployment "${DEP}" -n "${NS}" --type=strategic --patch "
          spec:
            template:
              spec:
                containers:
                - name: ${CTR}
                  image: ${IMAGE}
                  env:
                  - name: GIT_SHA
                    value: \"${IMAGE_TAG}\"
                  - name: IMAGE_TAG
                    value: \"${IMAGE_TAG}\"
                  - name: BUILD_TIME
                    value: \"${BT}\"
          "
          kubectl rollout status deployment/"${DEP}" -n "${NS}" --timeout=300s
          kubectl get deployment "${DEP}" -n "${NS}" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          for i in $(seq 1 30); do
            code="$(curl -sS -m 15 -o /tmp/healthz.json -w '%{http_code}' "${PUBLIC_URL}/healthz" || echo 000)"
            if [ "${code}" = "200" ]; then
              python3 - <<'PY'
          import json, os, sys
          data = json.load(open("/tmp/healthz.json"))
          expected = os.environ["IMAGE_TAG"]
          actual = data.get("git_sha") or ""
          print(f"healthz git_sha={actual}")
          if actual != expected and not (actual.startswith(expected[:7]) or expected.startswith(actual[:7])):
              sys.exit(f"healthz SHA mismatch expected={expected} actual={actual}")
          PY
              exit 0
            fi
            sleep 10
          done
          echo "healthz verification failed after rollout"
          exit 1

      - name: Deploy credential missing
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "BLOCKER_SEALOS_KUBECONFIG"
          exit 1
