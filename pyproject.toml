[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litigation-case-agent"
version = "0.2.0"
description = "诉讼案件工作 Agent V1 — Phase 2 database and domain model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cursor-sdk>=1.0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "reportlab>=4.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "autonomous_dev*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "autonomous_dev"]
exclude = ["docs/**/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B011"]
"backend/scripts/**" = ["E501", "I001"]
"autonomous_dev/**" = ["E501"]
"alembic/**" = ["E501"]
"backend/llm/prompts.py" = ["E501"]
